# Horizontal Pod Autoscaler — масштабируем по CPU и RPS
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qualix-hpa
  namespace: qualix
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qualix
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
